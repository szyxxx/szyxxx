name: Profile graphics
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: szyxxx
          UTC_OFFSET: 7
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: szyxxx
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=#161b22,#7F1D1D,#DC2626,#F59E0B,#FFD700
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
